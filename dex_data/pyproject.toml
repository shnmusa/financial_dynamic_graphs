[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dex-data"
version = "0.1.0"
description = "Ethereum Uniswap swap and transfer indexer"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
notebook = [
    "pandas>=2.2",
    "matplotlib>=3.8",
    "jupyter>=1.1",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]

[project.scripts]
dex-data = "dex_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dex_data = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "db: requires a live Postgres (docker compose up -d postgres)",
    "live: requires ingested data already present in dex_events",
]
filterwarnings = ["error::DeprecationWarning"]
